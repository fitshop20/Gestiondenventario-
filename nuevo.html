<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>REGISTRAR NUEVO PRODUCTO | FITSHOP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#a40213",
              "on-surface-variant": "#e4beba",
              "outline-variant": "#5b403d",
              "on-primary-fixed-variant": "#6d3733",
              "on-tertiary-fixed-variant": "#004d65",
              "on-error": "#690005",
              "on-secondary": "#680008",
              "background": "#131313",
              "tertiary-fixed": "#bee9ff",
              "on-background": "#e5e2e1",
              "error": "#ffb4ab",
              "surface-container-high": "#2a2a2a",
              "inverse-surface": "#e5e2e1",
              "primary-fixed-dim": "#ffb3ac",
              "on-tertiary": "#003546",
              "on-tertiary-fixed": "#001f2a",
              "on-secondary-fixed": "#410003",
              "surface-tint": "#ffb3ac",
              "surface-container-highest": "#353534",
              "surface-bright": "#393939",
              "outline": "#ab8985",
              "secondary-fixed-dim": "#ffb3ac",
              "on-primary": "#51221e",
              "error-container": "#93000a",
              "surface-dim": "#131313",
              "inverse-on-surface": "#313030",
              "on-tertiary-container": "#e9f7ff",
              "on-primary-fixed": "#370d0b",
              "primary-fixed": "#ffdad6",
              "on-error-container": "#ffdad6",
              "tertiary": "#7bd1f8",
              "secondary-fixed": "#ffdad6",
              "surface-variant": "#353534",
              "surface-container-lowest": "#0e0e0e",
              "inverse-primary": "#894e49",
              "surface-container": "#201f1f",
              "tertiary-fixed-dim": "#7bd1f8",
              "on-secondary-container": "#ffaea6",
              "on-secondary-fixed-variant": "#930010",
              "surface": "#131313",
              "primary": "#ffb3ac",
              "on-surface": "#e5e2e1",
              "on-primary-container": "#fff2f0",
              "tertiary-container": "#00799c",
              "surface-container-low": "#1c1b1b",
              "primary-container": "#9d5f5a",
              "secondary": "#ffb3ac"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(28, 27, 27, 0.7);
            backdrop-filter: blur(20px);
        }
        input:focus {
            box-shadow: 0 0 0 2px rgba(255, 179, 172, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#131313]/70 backdrop-blur-xl flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-red-600 dark:text-[#ffb3ac]">inventory_2</span>
<span class="text-2xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-[#d32f2f] to-[#9d5f5a] font-['Space_Grotesk']">FITSHOP</span>
</div>
<button class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[#e5e2e1]/60">notifications</span>
</button>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto">
<!-- Header Section -->
<div class="mb-10">
<span class="text-primary font-label text-[10px] uppercase tracking-[0.2em] font-bold mb-2 block">Módulo de Inventario</span>
<h1 class="text-4xl font-headline font-bold tracking-tighter leading-none italic uppercase">REGISTRAR NUEVO PRODUCTO</h1>
</div>
<!-- Form Canvas -->
<div class="space-y-8">
<!-- Scanner Section (High-Energy Accent) -->
<section class="relative group overflow-hidden rounded-xl bg-surface-container-low p-1">
<div class="absolute inset-0 bg-gradient-to-br from-[#d32f2f] to-[#9d5f5a] opacity-20"></div>
<div class="relative bg-surface-container rounded-[0.9rem] p-6 flex flex-col md:flex-row items-center gap-6">
<div class="w-24 h-24 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center shadow-[0px_10px_30px_rgba(211,47,47,0.3)] shrink-0">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
<div class="flex-grow w-full">
<label class="block text-primary font-label text-[10px] uppercase tracking-widest font-bold mb-2">Código de barras</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-lg px-4 py-3 text-on-surface placeholder:text-on-surface/30 font-mono tracking-widest focus:ring-1 focus:ring-primary transition-all" placeholder="Escanear o ingresar código" type="text"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 text-primary hover:text-primary-fixed-dim transition-colors p-2">
<span class="material-symbols-outlined">barcode_scanner</span>
</button>
</div>
</div>
</div>
</section>
<!-- General Information -->
<section class="bg-surface-container-low rounded-xl p-8 space-y-6">
<div class="grid grid-cols-1 gap-6">
<div>
<label class="block text-on-surface-variant font-label text-[10px] uppercase tracking-widest font-bold mb-3">Nombre del Producto</label>
<input class="w-full bg-surface-container border-none rounded-lg px-4 py-4 text-on-surface placeholder:text-on-surface/20 focus:ring-1 focus:ring-primary/40" placeholder="Ej. Proteína Isolate 2kg" type="text"/>
</div>
<div>
<label class="block text-on-surface-variant font-label text-[10px] uppercase tracking-widest font-bold mb-3">Descripción Detallada</label>
<textarea class="w-full bg-surface-container border-none rounded-lg px-4 py-4 text-on-surface placeholder:text-on-surface/20 focus:ring-1 focus:ring-primary/40 resize-none" placeholder="Especificaciones, sabor, marca..." rows="3"></textarea>
</div>
</div>
</section>
<!-- Stock & Logistics Bento -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Quantity & Expiry -->
<div class="bg-surface-container-low rounded-xl p-6 space-y-6">
<div>
<label class="block text-on-surface-variant font-label text-[10px] uppercase tracking-widest font-bold mb-3">Cantidad Inicial</label>
<div class="flex items-center gap-4 bg-surface-container rounded-lg p-1">
<button class="w-10 h-10 rounded-md bg-surface-container-highest flex items-center justify-center text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-grow bg-transparent border-none text-center font-headline text-xl font-bold focus:ring-0" type="number" value="0"/>
<button class="w-10 h-10 rounded-md bg-primary-container flex items-center justify-center text-white active:scale-90 transition-transform">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<div>
<label class="block text-on-surface-variant font-label text-[10px] uppercase tracking-widest font-bold mb-3">Fecha de Expiración</label>
<div class="relative">
<input class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-on-surface [color-scheme:dark] focus:ring-1 focus:ring-primary/40" type="date"/>
</div>
</div>
</div>
<!-- Pricing -->
<div class="bg-surface-container rounded-xl p-6 border border-outline-variant/10 flex flex-col justify-between">
<div>
<label class="block text-on-surface-variant font-label text-[10px] uppercase tracking-widest font-bold mb-3">Precio Costo (USD)</label>
<div class="flex items-center gap-2 border-b border-outline-variant/30 pb-2 mb-6">
<span class="text-primary font-headline font-light text-2xl">$</span>
<input class="w-full bg-transparent border-none p-0 font-headline text-3xl font-bold placeholder:text-on-surface/10 focus:ring-0" placeholder="0.00" type="text"/>
</div>
</div>
<div>
<label class="block text-primary font-label text-[10px] uppercase tracking-widest font-bold mb-3">Precio Venta (PVP)</label>
<div class="flex items-center gap-2">
<span class="text-primary font-headline font-light text-2xl">$</span>
<input class="w-full bg-transparent border-none p-0 font-headline text-4xl font-black italic text-primary placeholder:text-primary/20 focus:ring-0 tracking-tighter" placeholder="0.00" type="text"/>
</div>
</div>
</div>
</div>
<!-- Action Area -->
<div class="flex items-center gap-4 pt-4">
<button class="flex-grow h-16 rounded-full bg-gradient-to-br from-[#d32f2f] to-[#9d5f5a] text-white font-headline font-bold uppercase tracking-widest text-sm shadow-[0px_20px_40px_rgba(211,47,47,0.15)] active:scale-95 transition-all hover:brightness-110">
                    Guardar Producto
                </button>
<button class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant hover:bg-surface-bright transition-colors active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-24 flex justify-around items-center px-8 pb-4 bg-[#131313]/90 backdrop-blur-lg rounded-t-[3rem] z-50 shadow-[0px_-20px_40px_rgba(211,47,47,0.08)]">
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/50 hover:text-[#e5e2e1] transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">qr_code_scanner</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-bold mt-1">Escáner</span>
</a>
<a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#d32f2f] to-[#9d5f5a] text-white rounded-full px-6 py-2 shadow-lg active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">analytics</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-bold">Inventario</span>
</a>
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/50 hover:text-[#e5e2e1] transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-bold mt-1">Perfil</span>
</a>
</nav>
</body></html>
