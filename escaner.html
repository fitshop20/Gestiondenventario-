<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>FitShop - Escáner de Inventario</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-headline { font-family: 'Space Grotesk', sans-serif; }
        .scanner-overlay {
            background: linear-gradient(0deg, rgba(19,19,19,0.9) 0%, rgba(19,19,19,0) 50%, rgba(19,19,19,0.9) 100%);
        }
        .scan-region {
            box-shadow: 0 0 0 4000px rgba(19, 19, 19, 0.6);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "on-primary-fixed-variant": "#6d3733",
                "outline": "#ab8985",
                "tertiary-fixed-dim": "#7bd1f8",
                "secondary-fixed": "#ffdad6",
                "on-surface-variant": "#e4beba",
                "surface-container-low": "#1c1b1b",
                "on-primary-fixed": "#370d0b",
                "secondary-fixed-dim": "#ffb3ac",
                "primary-fixed-dim": "#ffb3ac",
                "on-error-container": "#ffdad6",
                "surface-variant": "#353534",
                "tertiary-fixed": "#bee9ff",
                "on-secondary-fixed-variant": "#930010",
                "surface-container-high": "#2a2a2a",
                "primary-fixed": "#ffdad6",
                "on-tertiary-fixed-variant": "#004d65",
                "tertiary": "#7bd1f8",
                "on-secondary-fixed": "#410003",
                "inverse-primary": "#894e49",
                "background": "#131313",
                "on-error": "#690005",
                "primary": "#ffb3ac",
                "error-container": "#93000a",
                "tertiary-container": "#00799c",
                "inverse-surface": "#e5e2e1",
                "primary-container": "#9d5f5a",
                "on-primary-container": "#fff2f0",
                "surface-container": "#201f1f",
                "secondary-container": "#a40213",
                "on-primary": "#51221e",
                "error": "#ffb4ab",
                "surface-container-lowest": "#0e0e0e",
                "on-secondary": "#680008",
                "secondary": "#ffb3ac",
                "surface": "#131313",
                "outline-variant": "#5b403d",
                "on-tertiary-container": "#e9f7ff",
                "on-tertiary": "#003546",
                "inverse-on-surface": "#313030",
                "surface-container-highest": "#353534",
                "surface-bright": "#393939",
                "on-tertiary-fixed": "#001f2a",
                "on-background": "#e5e2e1",
                "on-surface": "#e5e2e1",
                "surface-tint": "#ffb3ac",
                "surface-dim": "#131313",
                "on-secondary-container": "#ffaea6"
              },
              fontFamily: {
                "headline": ["Space Grotesk"],
                "body": ["Inter"],
                "label": ["Inter"]
              },
              borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden">
<!-- Top Navigation Anchor -->
<header class="bg-[#131313]/70 backdrop-blur-md fixed top-0 left-0 right-0 z-50">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-screen-2xl mx-auto">
<div class="text-2xl font-black italic tracking-tighter text-[#ffb3ac] font-['Space_Grotesk']">
                FitShop
            </div>
<div class="flex gap-4">
<button class="text-[#e5e2e1]/60 hover:text-[#ffb3ac] transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="text-[#e5e2e1]/60 hover:text-[#ffb3ac] transition-colors">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</div>
</header>
<!-- Main Content: Scanner Canvas -->
<main class="flex-grow relative pt-16 pb-24 h-screen overflow-hidden">
<!-- Live Camera Simulation View -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover brightness-50 contrast-125" data-alt="blurred interior of a modern high-end gym with professional weightlifting equipment and dramatic red accent lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCd6fs_Qyt3s5_wsiyiBxGQNd7X8s5YB0Fu26UBBvWWPJUigKv6jaqUwpkwuRctbCX8fQZnTvxmXtC4y8MNI60cVrp6tho44_W7KiO0W0-Rx8EJpe1tSLRxZhJGfzGnhCUjqLS_LVvQ39J8OZh2E0IJSIthMrzE5CAB6tjOr7ttQoThtZafbqKxLdH3PbnNH0dv8HpzjnzubXLvmdOVWQxLZqnEgis2AemN1vcup3mXZoCjPLPDlC7ueDIUYNMrQfrt0PIuAVmpbDXR"/>
<!-- Scanner Visual Aids -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<div class="scan-region w-72 h-48 border-2 border-primary rounded-lg relative">
<!-- Corner Brackets -->
<div class="absolute -top-1 -left-1 w-6 h-6 border-t-4 border-l-4 border-primary rounded-tl-md"></div>
<div class="absolute -top-1 -right-1 w-6 h-6 border-t-4 border-r-4 border-primary rounded-tr-md"></div>
<div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-4 border-l-4 border-primary rounded-bl-md"></div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-4 border-r-4 border-primary rounded-br-md"></div>
<!-- Scanning Laser Animation -->
<div class="absolute top-0 left-0 right-0 h-0.5 bg-primary/80 shadow-[0_0_15px_rgba(255,179,172,1)] animate-pulse"></div>
</div>
<p class="mt-8 text-primary font-headline font-bold uppercase tracking-widest text-sm bg-background/40 px-4 py-1 rounded-full backdrop-blur-sm">
                    Alinee el código de barras
                </p>
</div>
</div>
<!-- Detection Slide-up Overlay (Active State Simulation) -->
<div class="absolute bottom-28 left-4 right-4 z-40">
<div class="bg-surface-container-low/95 backdrop-blur-xl rounded-xl p-5 border border-outline-variant/20 shadow-2xl">
<!-- Product Overview Row -->
<div class="flex gap-4 items-start mb-6">
<div class="w-24 h-24 rounded-lg bg-surface-container-high overflow-hidden shrink-0">
<img class="w-full h-full object-cover" data-alt="professional photography of a high-end black container of whey protein powder with metallic red accents" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBr0nlAR2ryaxvxqkDOi33SPFNxNXketHypdV22zvWn3TvZVPkhLjzv2mb1RQLhFqQfqh3Lw-xN1_3gpuKr_CgaXCNgcTEhThQwzNCow2TUiC8ePjotz_DsxjZL_eLKBX6Nl7YubMDTaStz9ReChQe3KJ2puazWS-c32DYoXsNwlxQXunIZlbYivlELkBdSk-fqLo28e-Lo_I4cx2us9ly3KW0YVoe6oOisUNeIh2BLnErZoPfMjvUGpuel4ywLHAg3oZFg08S2EprV"/>
</div>
<div class="flex-grow">
<span class="text-[10px] font-bold uppercase tracking-[0.2em] text-primary/80">Premium Whey Protein</span>
<h2 class="text-xl font-headline font-bold text-on-surface mb-1">Impact Whey 2.5kg</h2>
<div class="flex items-center gap-2">
<span class="text-xs font-mono text-on-surface-variant">SKU: WHEY-2500-RED</span>
<span class="bg-primary/10 text-primary text-[10px] px-2 py-0.5 rounded-full font-bold uppercase">En Stock</span>
</div>
</div>
</div>
<!-- Stats Grid -->
<div class="grid grid-cols-2 gap-3 mb-6">
<div class="bg-surface-container px-4 py-3 rounded-xl">
<p class="text-[10px] uppercase tracking-wider text-on-surface-variant font-bold mb-1">Stock Actual</p>
<p class="text-2xl font-headline font-black text-on-surface">42 <span class="text-xs font-normal text-on-surface-variant">uds</span></p>
</div>
<div class="bg-surface-container px-4 py-3 rounded-xl">
<p class="text-[10px] uppercase tracking-wider text-on-surface-variant font-bold mb-1">Precio Venta</p>
<p class="text-2xl font-headline font-black text-primary">$54.90</p>
</div>
</div>
<!-- Quick Actions -->
<div class="flex gap-3 mb-6">
<button class="flex-1 bg-gradient-to-r from-primary to-primary-container text-on-primary py-4 rounded-full flex items-center justify-center gap-2 font-bold transition-transform active:scale-95 shadow-lg shadow-primary/10">
<span class="material-symbols-outlined text-xl">add_box</span>
<span class="font-headline tracking-tight">+ ENTRADA</span>
</button>
<button class="flex-1 bg-surface-container-highest text-on-surface py-4 rounded-full flex items-center justify-center gap-2 font-bold transition-transform active:scale-95 border border-outline-variant/30">
<span class="material-symbols-outlined text-xl">remove_circle</span>
<span class="font-headline tracking-tight">- SALIDA</span>
</button>
</div>
<!-- Manual Edits Form -->
<div class="space-y-4">
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1">
<label class="text-[10px] uppercase font-bold text-on-surface-variant tracking-widest pl-2">Nuevo Precio</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-bold">$</span>
<input class="w-full bg-surface-container-high border-none rounded-full py-3 pl-8 pr-4 text-sm focus:ring-1 focus:ring-primary text-on-surface font-headline font-medium" placeholder="0.00" type="number"/>
</div>
</div>
<div class="space-y-1">
<label class="text-[10px] uppercase font-bold text-on-surface-variant tracking-widest pl-2">Expiración</label>
<input class="w-full bg-surface-container-high border-none rounded-full py-3 px-4 text-sm focus:ring-1 focus:ring-primary text-on-surface appearance-none" type="date"/>
</div>
</div>
<button class="w-full py-3 bg-surface-container-highest/50 border border-outline-variant/20 rounded-xl flex items-center justify-center gap-3 text-on-surface-variant active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">add_a_photo</span>
<span class="text-xs font-bold uppercase tracking-widest">Foto Técnica de Producto</span>
</button>
</div>
</div>
</div>
<!-- Floating Action Button for Torch -->
<button class="fixed right-6 top-24 z-50 w-12 h-12 rounded-full bg-background/60 backdrop-blur-md border border-outline-variant/20 flex items-center justify-center text-primary shadow-xl">
<span class="material-symbols-outlined">flashlight_on</span>
</button>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-[#131313]/90 backdrop-blur-xl z-50 border-t border-[#5b403d]/20 rounded-t-[3rem] shadow-[0_-10px_40px_rgba(211,47,47,0.08)]">
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/40 p-3" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-tighter mt-1">Inicio</span>
</a>
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/40 p-3" href="#">
<span class="material-symbols-outlined">inventory</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-tighter mt-1">Stock</span>
</a>
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/40 p-3" href="#">
<span class="material-symbols-outlined">location_on</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-tighter mt-1">Sedes</span>
</a>
<a class="flex flex-col items-center justify-center text-[#ffb3ac] bg-[#ffb3ac]/10 rounded-full p-3 scale-110" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">filter_center_focus</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-tighter mt-1">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/40 p-3" href="#">
<span class="material-symbols-outlined">add_circle</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-tighter mt-1">Nuevo</span>
</a>
</nav>
</body></html>
