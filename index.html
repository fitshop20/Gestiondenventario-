<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitShop - Acceso Maestro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-fixed": "#370d0b",
              "surface-dim": "#131313",
              "on-error": "#690005",
              "error": "#ffb4ab",
              "surface-bright": "#393939",
              "on-error-container": "#ffdad6",
              "inverse-surface": "#e5e2e1",
              "secondary-fixed": "#ffdad6",
              "on-surface": "#e5e2e1",
              "surface": "#131313",
              "tertiary": "#7bd1f8",
              "surface-container-low": "#1c1b1b",
              "secondary-fixed-dim": "#ffb3ac",
              "on-tertiary-container": "#e9f7ff",
              "secondary-container": "#a40213",
              "on-secondary-fixed": "#410003",
              "surface-container": "#201f1f",
              "primary-fixed": "#ffdad6",
              "background": "#131313",
              "on-secondary-container": "#ffaea6",
              "primary-fixed-dim": "#ffb3ac",
              "on-tertiary-fixed-variant": "#004d65",
              "primary-container": "#9d5f5a",
              "on-surface-variant": "#e4beba",
              "error-container": "#93000a",
              "inverse-primary": "#894e49",
              "on-primary-container": "#fff2f0",
              "tertiary-container": "#00799c",
              "surface-tint": "#ffb3ac",
              "surface-container-highest": "#353534",
              "outline-variant": "#5b403d",
              "tertiary-fixed": "#bee9ff",
              "surface-container-high": "#2a2a2a",
              "secondary": "#ffb3ac",
              "on-secondary-fixed-variant": "#930010",
              "tertiary-fixed-dim": "#7bd1f8",
              "on-primary": "#51221e",
              "on-background": "#e5e2e1",
              "inverse-on-surface": "#313030",
              "primary": "#ffb3ac",
              "on-tertiary-fixed": "#001f2a",
              "surface-variant": "#353534",
              "on-secondary": "#680008"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .glass-effect {
            backdrop-filter: blur(20px);
            background: rgba(28, 27, 27, 0.7);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col items-center justify-center selection:bg-secondary-container selection:text-white">
<!-- TopAppBar Suppressed based on Transactional/Login rule -->
<main class="w-full max-w-md px-6 py-12 flex flex-col items-center">
<!-- Brand Identity Section -->
<div class="mb-12 text-center">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-secondary-container mb-4 shadow-[0px_0px_40px_rgba(164,2,19,0.3)]">
<span class="material-symbols-outlined text-4xl text-white" data-icon="inventory_2">inventory_2</span>
</div>
<h1 class="font-headline font-bold text-4xl tracking-tighter text-on-surface uppercase">FitShop</h1>
<p class="font-label text-xs uppercase tracking-[0.2em] text-outline mt-2">Sistema de Control de Inventario</p>
</div>
<!-- Login Container -->
<div class="w-full space-y-8">
<div class="space-y-6">
<!-- ID de Operador -->
<div class="space-y-2">
<label class="block font-label text-[10px] font-bold uppercase tracking-widest text-outline-variant px-1">ID de Operador</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline-variant group-focus-within:text-primary">
<span class="material-symbols-outlined text-xl" data-icon="badge">badge</span>
</div>
<input class="w-full bg-surface-container border-none h-14 pl-12 pr-4 rounded-xl text-on-surface placeholder:text-outline/40 transition-all focus:ring-1 focus:ring-secondary-container" placeholder="Ej: OPS-2024" type="text"/>
</div>
</div>
<!-- Clave de Acceso -->
<div class="space-y-2">
<label class="block font-label text-[10px] font-bold uppercase tracking-widest text-outline-variant px-1">Clave de Acceso</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline-variant group-focus-within:text-primary">
<span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container border-none h-14 pl-12 pr-4 rounded-xl text-on-surface placeholder:text-outline/40 transition-all focus:ring-1 focus:ring-secondary-container" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Selector de Sede -->
<div class="space-y-2">
<label class="block font-label text-[10px] font-bold uppercase tracking-widest text-outline-variant px-1">Sede de Operación</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline-variant group-focus-within:text-primary">
<span class="material-symbols-outlined text-xl" data-icon="location_on">location_on</span>
</div>
<select class="w-full bg-surface-container border-none h-14 pl-12 pr-10 rounded-xl text-on-surface appearance-none focus:ring-1 focus:ring-secondary-container">
<option value="sl">San Luis</option>
<option value="si">San Ignacio</option>
<option value="mm">Milenium Mall</option>
<option value="ga">Galerías Ávila</option>
<option value="se">Sede Extra</option>
</select>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-outline-variant">
<span class="material-symbols-outlined text-xl" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="space-y-4 pt-4">
<button class="w-full bg-secondary-container hover:bg-secondary-container/90 active:scale-95 transition-all duration-200 h-14 rounded-full font-headline font-bold text-on-primary-container tracking-wider flex items-center justify-center gap-3 shadow-lg shadow-secondary-container/20">
                    INGRESAR AL SISTEMA
                    <span class="material-symbols-outlined" data-icon="login">login</span>
</button>
<button class="w-full bg-surface-container-highest/50 hover:bg-surface-container-highest active:scale-95 transition-all duration-200 h-14 rounded-full font-headline font-semibold text-on-surface tracking-wide flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
                    CONSULTA RÁPIDA (ESCANEAR)
                </button>
</div>
</div>
<!-- Security Footer -->
<footer class="mt-16 text-center">
<div class="flex items-center justify-center gap-2 text-outline-variant mb-2">
<span class="material-symbols-outlined text-sm" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-label text-[10px] uppercase tracking-widest">Acceso Encriptado AES-256</span>
</div>
<p class="font-label text-[9px] text-outline/30 px-8 leading-relaxed">
                Este terminal está reservado para personal autorizado. Todas las sesiones son monitoreadas y registradas por el departamento de seguridad.
            </p>
</footer>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-container/5 rounded-full blur-[120px] pointer-events-none"></div>
</body></html>
