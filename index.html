<!DOCTYPE html>

<html class="dark" lang="es"><head>

<style>
      body {
        background-color: #131313;
        color: #e5e2e1;
        font-family: 'Inter', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-effect {
        background: rgba(28, 27, 27, 0.7);
        backdrop-filter: blur(20px);
      }
      .brand-accent {
        background: linear-gradient(135deg, #ffb3ac 0%, #9d5f5a 100%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="flex flex-col min-h-screen">
<!-- Supressed Navigation Shell for Login Logic -->
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 max-w-md mx-auto w-full">
<!-- Logo Section -->
<div class="mb-12 text-center">
<div class="inline-flex items-center justify-center w-20 h-20 brand-accent rounded-full mb-6 shadow-[0_0_40px_rgba(255,179,172,0.15)]">
<span class="material-symbols-outlined text-4xl text-on-primary" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<h1 class="font-headline text-5xl font-black italic tracking-tighter text-primary">
                FitShop
            </h1>
<p class="font-label text-sm uppercase tracking-[0.2em] text-on-surface-variant mt-2">
                Sistema de Control Maestro
            </p>
</div>
<!-- Login Form Container -->
<div class="w-full space-y-8">
<div class="space-y-4">
<!-- User Select -->
<div class="relative">
<label class="block font-label text-[10px] uppercase tracking-widest text-primary mb-2 ml-4">Usuario Maestro</label>
<div class="relative">
<select class="w-full bg-surface-container border-none text-on-surface rounded-xl px-5 py-4 appearance-none focus:ring-2 focus:ring-primary/30 transition-all font-body">
<option value="adreansuar">adreansuar</option>
<option value="fitshop_maestro">Fitshop Maestro</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary pointer-events-none">expand_more</span>
</div>
</div>
<!-- Password Input -->
<div class="relative">
<label class="block font-label text-[10px] uppercase tracking-widest text-primary mb-2 ml-4">Credenciales Hashed</label>
<div class="relative">
<input class="w-full bg-surface-container border-none text-on-surface rounded-xl px-5 py-4 focus:ring-2 focus:ring-primary/30 transition-all font-body placeholder:text-on-surface-variant/30" placeholder="••••••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">lock</span>
</div>
</div>
<!-- Branch Select -->
<div class="relative">
<label class="block font-label text-[10px] uppercase tracking-widest text-primary mb-2 ml-4">Sede de Operación</label>
<div class="relative">
<select class="w-full bg-surface-container border-none text-on-surface rounded-xl px-5 py-4 appearance-none focus:ring-2 focus:ring-primary/30 transition-all font-body">
<option value="san_luis">San Luis</option>
<option value="san_ignacio">San Ignacio</option>
<option value="milenium_mall">Milenium Mall</option>
<option value="galerias_avila">Galerías Ávila</option>
<option value="sede_extra">Sede Extra</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary pointer-events-none">location_on</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full brand-accent text-on-primary font-headline font-bold text-lg py-5 rounded-full shadow-[0_10px_30px_rgba(211,47,47,0.2)] active:scale-[0.98] transition-transform">
                INGRESAR AL SISTEMA
            </button>
<!-- Quick Access Divider -->
<div class="flex items-center gap-4 py-4">
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant/40">Acceso Directo</span>
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
</div>
<!-- Rapid Check Button -->
<button class="w-full bg-surface-container-high border border-outline-variant/20 text-on-surface font-headline font-semibold text-base py-5 rounded-xl flex items-center justify-center gap-3 active:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-primary">qr_code_scanner</span>
                CONSULTA RÁPIDA (ESCANEAR)
            </button>
</div>
<!-- Footer / Support -->
<footer class="mt-auto pt-12 text-center opacity-40">
<p class="font-label text-[10px] uppercase tracking-widest">
                FitShop v4.2.0 • Terminal Autorizada
            </p>
</footer>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-5%] right-[-5%] w-[30%] h-[30%] bg-secondary-container/10 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Visual Anchor for Branding Background -->
<div class="fixed inset-0 z-[-1] overflow-hidden opacity-20">
<img class="w-full h-full object-cover grayscale mix-blend-overlay" data-alt="atmospheric dark gym interior with dramatic red lighting on professional weightlifting equipment and matte black surfaces" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDydNDW8LCu-LbaiHql2E0pxI-m10sMOEmFbAiUo7dKr1nbh5Z22iPUynPYd7sHnUHeSe8I0rl9S_qPB-XFJXmWmgPo6a3b9ZnWFkZ8I2nCWUBsnUtYHNQolS0JG3HyYXZaMISn0BKebtwIv-BmTUIevIMRHhfitriyqr1Lc19-x4KFYIOJ0uyT3VBaiuTKx9T342VyYV2UwHmrpnP4l19a3FRzCiJ_z2LM_kXhDaBVhbnCqTe4W9Ctpr52hNrBwIjfaP4JMZIfW6dq"/>
</div>
</body></html>
