<!DOCTYPE html>

<html class="dark" lang="es-419"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitShop - Acceso Seguro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-tint": "#ffb3ac",
              "on-tertiary-fixed-variant": "#004d65",
              "on-secondary": "#680008",
              "secondary-fixed": "#ffdad6",
              "surface-dim": "#131313",
              "surface-container-high": "#2a2a2a",
              "primary-container": "#9d5f5a",
              "on-error-container": "#ffdad6",
              "on-primary-container": "#fff2f0",
              "primary-fixed": "#ffdad6",
              "tertiary": "#7bd1f8",
              "on-tertiary-fixed": "#001f2a",
              "surface-container-low": "#1c1b1b",
              "secondary": "#ffb3ac",
              "outline": "#ab8985",
              "on-background": "#e5e2e1",
              "on-error": "#690005",
              "primary": "#ffb3ac",
              "on-primary": "#51221e",
              "on-secondary-fixed": "#410003",
              "on-primary-fixed-variant": "#6d3733",
              "surface": "#131313",
              "error": "#ffb4ab",
              "tertiary-fixed": "#bee9ff",
              "surface-bright": "#393939",
              "secondary-container": "#a40213",
              "tertiary-container": "#00799c",
              "surface-variant": "#353534",
              "secondary-fixed-dim": "#ffb3ac",
              "surface-container-lowest": "#0e0e0e",
              "on-secondary-fixed-variant": "#930010",
              "inverse-primary": "#894e49",
              "surface-container": "#201f1f",
              "outline-variant": "#5b403d",
              "background": "#131313",
              "inverse-surface": "#e5e2e1",
              "on-surface-variant": "#e4beba",
              "error-container": "#93000a",
              "inverse-on-surface": "#313030",
              "primary-fixed-dim": "#ffb3ac",
              "on-primary-fixed": "#370d0b",
              "on-tertiary": "#003546",
              "on-secondary-container": "#ffaea6",
              "on-surface": "#e5e2e1",
              "tertiary-fixed-dim": "#7bd1f8",
              "surface-container-highest": "#353534",
              "on-tertiary-container": "#e9f7ff"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .kinetic-blur {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary selection:text-on-primary">
<!-- Background Decorative Element -->
<div class="fixed inset-0 overflow-hidden -z-10">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-secondary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Auth Canvas -->
<main class="w-full max-w-md space-y-10">
<!-- Brand Identity Section -->
<header class="text-center space-y-4">
<div class="inline-flex items-center justify-center p-5 bg-surface-container rounded-xl shadow-2xl border border-outline-variant/10">
<span class="material-symbols-outlined text-6xl text-primary" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
</div>
<div class="space-y-1">
<h1 class="font-headline text-5xl font-extrabold tracking-tighter text-on-surface uppercase">
                    FitShop
                </h1>
<p class="font-label text-xs tracking-[0.3em] text-on-surface-variant font-medium uppercase">
                    Gestión de Activos de Alto Rendimiento
                </p>
</div>
</header>
<!-- Login Card -->
<section class="bg-surface-container-low rounded-lg p-8 shadow-2xl space-y-8 border border-outline-variant/5">
<div class="space-y-2 text-center">
<h2 class="font-headline text-xl font-bold text-on-surface">Panel de Seguridad</h2>
<div class="h-1 w-12 bg-primary mx-auto rounded-full"></div>
</div>
<form class="space-y-6" id="loginForm">
<!-- User ID Field -->
<div class="space-y-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant font-bold ml-1" for="userId">ID de Usuario</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant" data-icon="person">person</span>
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/50 transition-all outline-none" id="userId" name="userId" placeholder="Ingresa tu ID" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant font-bold ml-1" for="password">Clave de Acceso</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/50 transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Location Selector -->
<div class="space-y-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant font-bold ml-1" for="location">Seleccionar Sede</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant" data-icon="location_on">location_on</span>
<select class="w-full bg-surface-container-highest border-none rounded-xl py-4 pl-12 pr-10 text-on-surface appearance-none focus:ring-2 focus:ring-primary/50 transition-all outline-none" id="location" name="location">
<option value="san_luis">San Luis</option>
<option value="san_ignacio">San Ignacio</option>
<option value="milenium">Milenium Mall</option>
<option value="galerias">Galerías Ávila</option>
<option value="extra">Sede Extra</option>
</select>
<span class="material-symbols-outlined absolute right-4 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary-container hover:bg-secondary-container/90 text-white font-headline font-bold py-5 rounded-full transition-all active:scale-95 shadow-[0px_10px_30px_rgba(164,2,19,0.3)] tracking-tight uppercase" type="submit">
                    INGRESAR AL SISTEMA
                </button>
</form>
</section>
<!-- Quick Access Section -->
<footer class="space-y-4">
<div class="flex items-center gap-4 py-2">
<div class="h-px flex-1 bg-outline-variant/20"></div>
<span class="font-label text-[10px] text-on-surface-variant font-bold uppercase tracking-widest">Acceso Rápido</span>
<div class="h-px flex-1 bg-outline-variant/20"></div>
</div>
<a class="group flex items-center justify-between p-4 bg-surface-container-high rounded-xl border border-outline-variant/10 hover:border-primary/30 transition-all active:scale-98" href="escaner.html" id="scanAccess">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-primary transition-colors group-hover:bg-primary group-hover:text-on-primary">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
</div>
<div class="text-left">
<span class="block font-headline text-sm font-bold text-on-surface tracking-tight">CONSULTA RÁPIDA</span>
<span class="block font-label text-[10px] text-on-surface-variant uppercase tracking-tighter">ESCANEAR ACTIVO</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-all group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</a>
</footer>
<!-- Security Badge -->
<div class="flex items-center justify-center gap-2 py-4">
<span class="material-symbols-outlined text-tertiary text-lg" data-icon="verified_user">verified_user</span>
<p class="font-label text-[10px] text-on-surface-variant/60 uppercase tracking-widest font-medium">Conexión de Alta Seguridad Encriptada</p>
</div>
</main>
<script>
        /**
         * Manejo de Inicio de Sesión - FitShop Maestro
         * Compatibilidad asegurada para Samsung Galaxy A35 y dispositivos móviles modernos.
         */
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const scanBtn = document.getElementById('scanAccess');

            // Prevenir comportamiento por defecto y validar credenciales
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const user = document.getElementById('userId').value;
                const pass = document.getElementById('password').value;
                const location = document.getElementById('location').value;

                // Validación de credenciales según requerimiento técnico
                if ((user === 'adreansuar' && pass === 'admindefinitivo2.0') || 
                    (user === 'Fitshop Maestro' && pass === 'Fitshop-maestro2.0')) {
                    
                    // Simulación de éxito y redirección
                    this.querySelector('button').innerHTML = '<span class="flex items-center justify-center gap-2"><span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> VALIDANDO...</span>';
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html?sede=' + location;
                    }, 1200);
                } else {
                    // Feedback de error simple
                    alert('Credenciales de acceso inválidas. Por favor verifique e intente de nuevo.');
                }
            });

            // Manejo de acceso por escaneo
            scanBtn.addEventListener('click', function(e) {
                // El link funciona de forma nativa, pero podemos añadir lógica de tracking o precarga aquí
                console.log('Iniciando interfaz de escaneo...');
            });
        });
    </script>
</body></html>
