<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<!-- Background Layer -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-br from-background/90 via-background/80 to-primary/10 z-10"></div>
<img class="w-full h-full object-cover grayscale-[20%] opacity-40" data-alt="Modern high-end warehouse interior with organized shelves and soft cinematic lighting reflecting off clean floors" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdyjgr9c_8pm8_hMQ4FlnbQatmy7fK9oTrJR1XrGvHRlvJuL_gyAZWXm6ylOhR9bvjAOfcU6B0ZZd496TR1ihZpWxQlQsTyRTGXqAKalmghdKnecuKTVSLZYlqNaMDtthygjfkSRYPurt6FKHfV-yHbqG1Fw1bgcdGJ28_XLZ1D4Rs_af_HzMtPSJUEtNdUkAe16dNx66VT2WadrLE2JuyitkxR77C1O_xr9Ir25sdaMjkSC7y3qsiwr0XFqDfbho7JKBSP3x7rSw"/>
</div>
<!-- Login Container -->
<main class="relative z-20 w-full max-w-md">
<div class="bg-surface-container-lowest rounded-lg shadow-[0_20px_50px_rgba(0,0,0,0.1)] p-8 md:p-12 backdrop-blur-sm border border-outline-variant/15">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-6 shadow-lg rotate-3">
<span class="material-symbols-outlined text-white text-4xl" data-icon="inventory_2">inventory_2</span>
</div>
<h1 class="text-4xl font-black font-headline tracking-tighter text-on-surface">FITSHOP</h1>
<p class="text-secondary font-label text-xs uppercase tracking-[0.2em] mt-2 opacity-60">Inventory Management</p>
</div>
<!-- Form Section -->
<form class="space-y-6" onsubmit="return false;">
<!-- Username Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold font-label text-on-surface-variant ml-1" for="usuario">Usuario</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-xl" data-icon="person">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-md focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-200 text-on-surface font-medium" id="usuario" name="usuario" placeholder="Ingrese su usuario" type="text" value="Fitshopinventory"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block text-sm font-semibold font-label text-on-surface-variant" for="clave">Clave</label>
<a class="text-xs font-semibold text-primary hover:opacity-80 transition-opacity" href="#">¿Olvidó su clave?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-xl" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-surface-container-highest border-none rounded-md focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-200 text-on-surface font-medium" id="clave" name="clave" placeholder="Ingrese su clave" type="password" value="adminpro2.0fit"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center px-1">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-on-secondary-fixed-variant font-medium" for="remember-me">Mantener sesión iniciada</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-white py-5 px-6 rounded-xl font-headline font-bold text-lg tracking-wide shadow-[0_10px_20px_rgba(176,47,0,0.3)] hover:shadow-[0_15px_25px_rgba(176,47,0,0.4)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Entrar
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Section -->
<div class="mt-10 pt-8 border-t border-outline-variant/10 text-center">
<p class="text-sm text-secondary">
                    ¿No tienes acceso? <a class="text-primary font-bold hover:underline" href="#">Contactar soporte</a>
</p>
</div>
</div>
<!-- System Status Bar (Subtle) -->
<div class="mt-8 flex justify-center items-center gap-6 opacity-40">
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
<span class="text-[10px] font-bold uppercase tracking-tighter">System Online</span>
</div>
<div class="flex items-center gap-2">
<span class="text-[10px] font-bold uppercase tracking-tighter">v2.4.0-pro</span>
</div>
</div>
