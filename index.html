<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitShop - Acceso Maestro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-low": "#1c1b1b",
              "surface-variant": "#353534",
              "secondary-container": "#a40213",
              "primary-fixed-dim": "#ffb3ac",
              "on-surface-variant": "#e4beba",
              "on-background": "#e5e2e1",
              "surface-container": "#201f1f",
              "outline-variant": "#5b403d",
              "surface": "#131313",
              "on-surface": "#e5e2e1",
              "primary": "#ffb3ac",
              "primary-container": "#9d5f5a",
              "on-primary": "#51221e",
              "error": "#ffb4ab",
              "vinotinto": "#800020"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-effect {
        backdrop-filter: blur(20px);
        background: rgba(28, 27, 27, 0.7);
      }
      .gradient-button {
        background: linear-gradient(135deg, #800020 0%, #a40213 100%);
      }
      /* Hide arrows in number input */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col items-center justify-center selection:bg-primary/30">
<!-- Top Navigation Anchor (Manual Implementation based on JSON) -->
<header class="fixed top-0 w-full z-50 bg-[#131313]/70 backdrop-blur-xl flex items-center justify-between px-6 h-16">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#d32f2f]" style="font-size: 28px;">inventory_2</span>
<h1 class="font-['Space_Grotesk'] font-bold tracking-tighter text-[#d32f2f] text-2xl uppercase">FitShop</h1>
</div>
<div class="hidden md:flex gap-6">
<span class="text-[#d32f2f] font-label font-bold text-xs uppercase tracking-widest">Acceso Maestro</span>
</div>
</header>
<main class="w-full max-w-md px-6 pt-24 pb-32 flex flex-col gap-8">
<!-- Hero Section / Brand Identity -->
<section class="text-center space-y-2">
<div class="inline-block px-3 py-1 rounded-full bg-secondary-container/20 border border-outline-variant/20 mb-4">
<span class="text-primary text-[10px] font-bold uppercase tracking-[0.2em]">Seguridad de Nivel 5</span>
</div>
<h2 class="font-headline text-4xl font-extrabold tracking-tight text-on-surface leading-none">
                SISTEMA DE <span class="text-primary-fixed-dim">CONTROL MAESTRO</span>
</h2>
<p class="text-on-surface-variant font-medium text-sm">Ingrese sus credenciales para gestionar inventarios</p>
</section>
<!-- Login Form -->
<div class="bg-surface-container-low rounded-xl p-8 border border-outline-variant/10 shadow-2xl space-y-6">
<form class="space-y-5" id="loginForm">
<!-- User Input -->
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Usuario Maestro</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" style="font-size: 20px;">account_circle</span>
<input class="w-full bg-surface-container border-none rounded-full py-4 pl-12 pr-6 text-on-surface focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline-variant/50" id="username" placeholder="Ej: adreansuar" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" style="font-size: 20px;">lock</span>
<input class="w-full bg-surface-container border-none rounded-full py-4 pl-12 pr-6 text-on-surface focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline-variant/50" id="password" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<!-- HQ Selector -->
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Sede de Operación</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" style="font-size: 20px;">location_on</span>
<select class="w-full appearance-none bg-surface-container border-none rounded-full py-4 pl-12 pr-10 text-on-surface focus:ring-2 focus:ring-primary/50 transition-all" id="sede" required="">
<option value="san-luis">San Luis</option>
<option value="san-ignacio">San Ignacio</option>
<option value="milenium-mall">Milenium Mall</option>
<option value="galerias-avila">Galerías Ávila</option>
<option value="sede-extra">Sede Extra</option>
</select>
<span class="material-symbols-outlined absolute right-4 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Submit Button -->
<button class="w-full gradient-button text-white font-headline font-bold text-lg py-4 rounded-full shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
<span>INGRESAR AL SISTEMA</span>
<span class="material-symbols-outlined">login</span>
</button>
</form>
</div>
<!-- Quick Access Section -->
<section class="space-y-4">
<div class="flex items-center gap-4">
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
<span class="text-[10px] font-bold uppercase tracking-widest text-outline">Acceso Directo</span>
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
</div>
<button class="w-full bg-surface-container-highest/30 border border-outline-variant/30 text-on-surface font-headline font-bold py-4 rounded-xl flex items-center justify-center gap-3 hover:bg-surface-container-highest/50 transition-all active:scale-95" onclick="window.location.href='escaner.html'">
<span class="material-symbols-outlined text-primary">qr_code_scanner</span>
<span>CONSULTA RÁPIDA (ESCANEAR)</span>
</button>
</section>
</main>
<!-- Bottom Navigation Shell (Manual Implementation based on JSON) -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-center px-4 pb-safe bg-[#1c1b1b] rounded-t-[3rem] z-50 shadow-[0px_-20px_40px_rgba(211,47,47,0.08)]">
<a class="flex flex-col items-center justify-center bg-[#201f1f] text-[#ffb3ac] rounded-full px-6 py-2 transition-all" href="index.html">
<span class="material-symbols-outlined">login</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-bold mt-1">Ingreso</span>
</a>
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/50 px-6 py-2 hover:text-[#ffb3ac] active:scale-90 transition-all" href="escaner.html">
<span class="material-symbols-outlined">qr_code_scanner</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-bold mt-1">Escaneo</span>
</a>
<a class="flex flex-col items-center justify-center text-[#e5e2e1]/50 px-6 py-2 hover:text-[#ffb3ac] active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined">location_on</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-bold mt-1">Sedes</span>
</a>
</nav>
<!-- Logic Script -->
<script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userInput = document.getElementById('username').value.trim();
            const passInput = document.getElementById('password').value.trim();
            const sedeSelect = document.getElementById('sede').value;

            const credentials = [
                { u: 'adreansuar', p: 'admindefinitivo2.0' },
                { u: 'Fitshop Maestro', p: 'Fitshop-maestro2.0' }
            ];

            const isValid = credentials.some(cred => cred.u === userInput && cred.p === passInput);

            if (isValid) {
                // Flash success feedback
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = '<span>AUTORIZADO...</span>';
                btn.classList.add('opacity-50');
                
                setTimeout(() => {
                    window.location.href = `${sedeSelect}.html`;
                }, 800);
            } else {
                alert('Credenciales maestras inválidas. Acceso denegado.');
                document.getElementById('password').value = '';
            }
        });
    </script>
</body></html>
